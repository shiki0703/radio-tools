<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>制作ハブ</title>
<style>
  :root {
    --bg: #f3f5f9;
    --panel: #ffffff;
    --panel-2: #f7f9fc;
    --line: #e1e6ee;
    --line-strong: #cdd4de;
    --text: #1c2230;
    --muted: #626b7c;
    --accent: #2563eb;
    --accent-soft: #e7eeff;
    --radio: #2563eb;
    --cam: #e2702a;
    --cam-soft: #fdefe5;
    --ok: #1f8a5b;
    --ok-soft: #e3f4ec;
    --warn: #9a5b00;
    --warn-soft: #fff1d6;
    --bad: #b42323;
    --bad-soft: #fdecec;
    --shadow: 0 1px 2px rgba(16, 24, 40, .06), 0 2px 8px rgba(16, 24, 40, .05);
    font-family: "Yu Gothic UI", "Meiryo UI", "Hiragino Sans", system-ui, sans-serif;
    font-size: 14px;
    color: var(--text);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); padding-inline: 20px; }
  [hidden] { display: none !important; }
  .wrap { max-width: 1080px; margin: 0 auto; padding-block: 22px 40px; display: grid; gap: 22px; }
  h1, h2, h3 { margin: 0; }
  p { margin: 0; line-height: 1.6; }
  button {
    font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--line-strong);
    border-radius: 8px; padding: 7px 14px; cursor: pointer; white-space: nowrap;
  }
  button:hover:not(:disabled) { background: var(--panel-2); }
  button:disabled { opacity: .5; cursor: default; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 700; }
  button.primary:hover:not(:disabled) { background: #1d4fd0; }
  button.cam { background: var(--cam); border-color: var(--cam); color: #fff; font-weight: 700; }
  button.cam:hover:not(:disabled) { background: #c95f1f; }
  button.ghost { border-color: transparent; background: transparent; color: var(--muted); }
  button:focus-visible { outline: 3px solid rgba(37, 99, 235, .35); outline-offset: 1px; }

  header.top { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .logo { width: 34px; height: 34px; border-radius: 9px; background: linear-gradient(135deg, var(--radio) 0 50%, var(--cam) 50% 100%); flex: none; }
  header.top h1 { font-size: 22px; }
  header.top p { color: var(--muted); flex-basis: 100%; }

  .pipeline { display: grid; grid-template-columns: 1fr auto 1.3fr auto 1.3fr auto 1fr; align-items: stretch; gap: 8px; }
  .pipeline > div { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: grid; gap: 2px; align-content: center; }
  .pipeline b { font-size: 14px; }
  .pipeline span { font-size: 12px; color: var(--muted); }
  .pipeline .arrow { background: none; border: 0; padding: 0; color: var(--muted); font-size: 18px; place-content: center; }
  .pipeline .radio { border-top: 3px solid var(--radio); }
  .pipeline .cam { border-top: 3px solid var(--cam); }

  .tools { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 16px; }
  .tool { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); padding: 16px 18px; display: grid; gap: 10px; }
  .tool-head { display: flex; align-items: center; gap: 10px; justify-content: space-between; }
  .tool-head h2 { font-size: 18px; display: flex; gap: 8px; align-items: center; }
  .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  .tool.radio .dot { background: var(--radio); }
  .tool.cam .dot { background: var(--cam); }
  .tool p { color: var(--muted); }
  .pill { font-size: 12px; font-weight: 700; border-radius: 99px; padding: 2px 10px; white-space: nowrap; }
  .pill.on { background: var(--ok-soft); color: var(--ok); }
  .pill.off { background: #edf0f4; color: var(--muted); }
  .pill.busy { background: var(--warn-soft); color: var(--warn); }
  .pill.bad { background: var(--bad-soft); color: var(--bad); }
  .progress { height: 6px; background: #e8ebf0; border-radius: 99px; overflow: hidden; }
  .progress div { height: 100%; background: var(--cam); transition: width .4s; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .small { font-size: 12px; color: var(--muted); }

  section.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); padding: 16px 18px; display: grid; gap: 12px; }
  .card-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
  .card-head h2 { font-size: 17px; }
  .card-head p { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .notice { border-radius: 8px; padding: 8px 12px; font-size: 13px; }
  .notice.busy { background: var(--warn-soft); color: var(--warn); }
  ul.rows { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
  ul.rows li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px 12px; border: 1px solid var(--line); border-radius: 9px; background: var(--panel-2); }
  .row-name { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row-sub { font-size: 12px; color: var(--muted); display: flex; gap: 12px; flex-wrap: wrap; font-variant-numeric: tabular-nums; }
  .empty { border: 1.5px dashed var(--line-strong); border-radius: 9px; padding: 18px; text-align: center; color: var(--muted); }
  details.paths summary { cursor: pointer; font-weight: 700; }
  .path-row { display: grid; grid-template-columns: 130px minmax(0, 1fr) auto; gap: 10px; align-items: center; margin-top: 8px; }
  .path { font-family: Consolas, monospace; font-size: 12px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  #toasts { position: fixed; right: 20px; bottom: 20px; display: grid; gap: 8px; z-index: 10; }
  .toast { background: #1f2937; color: #fff; padding: 10px 16px; border-radius: 8px; max-width: 460px; line-height: 1.5; box-shadow: 0 6px 20px rgba(0,0,0,.2); }
  .toast.bad { background: #991b1b; }
  .banner { background: #991b1b; color: #fff; padding: 10px; text-align: center; border-radius: 8px; }

  @media (max-width: 760px) {
    .pipeline { grid-template-columns: 1fr; }
    .pipeline .arrow { transform: rotate(90deg); }
    .path-row { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div id="banner" class="banner" hidden></div>
  <header class="top">
    <span class="logo" aria-hidden="true"></span>
    <h1>制作ハブ</h1>
    <p>収録から完成まで、2つのツールをここから使います。処理はすべてこのPCの中で行います。</p>
  </header>

  <div class="pipeline" aria-label="作業の流れ">
    <div><b>収録素材</b><span>ラジオ音声・カメラ動画</span></div>
    <div class="arrow">→</div>
    <div class="radio"><b>Radio Sync</b><span>音声と映像を合わせて、話ごとの動画に</span></div>
    <div class="arrow">→</div>
    <div class="cam"><b>動画クリッパー</b><span>テロップを入れて、切り抜きを作る</span></div>
    <div class="arrow">→</div>
    <div><b>完成</b><span>テロップ付き動画・切り抜き</span></div>
  </div>

  <div class="tools">
    <article class="tool radio" id="toolRadio"></article>
    <article class="tool cam" id="toolClipper"></article>
  </div>

  <section class="card">
    <div class="card-head">
      <div>
        <h2>Radio Sync で書き出した動画</h2>
        <p>「テロップ・切り抜きへ送る」で、動画クリッパーへ渡します(動画クリッパーが止まっていれば自動で起動します)。</p>
      </div>
      <button id="pickSend">ほかの動画を選んで送る</button>
    </div>
    <div id="busyNotice" class="notice busy" hidden></div>
    <div id="exports"></div>
  </section>

  <section class="card">
    <div class="card-head">
      <div>
        <h2>動画クリッパーの完成品</h2>
        <p>新しい順に表示します。フォルダの中にテロップ付き動画と切り抜きが入っています。</p>
      </div>
    </div>
    <div id="results"></div>
  </section>

  <section class="card">
    <details class="paths">
      <summary>ツールの場所</summary>
      <div id="paths"></div>
    </details>
  </section>
</div>
<div id="toasts"></div>

<script>
'use strict';
const $ = (id) => document.getElementById(id);

const TOKEN = (() => {
  const m = location.hash.match(/t=([\w-]+)/);
  try {
    if (m) {
      sessionStorage.setItem('hub-token', m[1]);
      history.replaceState(null, '', location.pathname);
      return m[1];
    }
    return sessionStorage.getItem('hub-token');
  } catch {
    return m ? m[1] : null;
  }
})();

function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'disabled') el.disabled = true;
    else el.setAttribute(k, v);
  }
  for (const kid of kids.flat()) if (kid != null && kid !== false && kid !== '') el.append(kid instanceof Node ? kid : String(kid));
  return el;
}

let failures = 0;
async function api(path, body) {
  let res;
  try {
    res = await fetch(path, {
      method: body === undefined ? 'GET' : 'POST',
      headers: { 'X-Token': TOKEN, 'Content-Type': 'application/json' },
      body: body === undefined ? undefined : JSON.stringify(body),
    });
  } catch {
    if (++failures >= 2) showBanner('ハブが終了しています。「はじめる」から起動し直してください。');
    throw new Error('ハブと接続できませんでした。');
  }
  failures = 0;
  showBanner('');
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || `エラーが発生しました(${res.status})`);
  return data;
}

function showBanner(text) {
  $('banner').textContent = text;
  $('banner').hidden = !text;
}

function toast(text, kind = '') {
  const el = h('div', { class: 'toast ' + kind }, text);
  $('toasts').append(el);
  setTimeout(() => el.remove(), kind === 'bad' ? 8000 : 4000);
}

const basename = (p) => String(p || '').split(/[\\/]/).pop();

function fmtDuration(sec) {
  const s = Math.round(sec || 0);
  const hh = Math.floor(s / 3600), mm = Math.floor(s % 3600 / 60), ss = s % 60;
  return hh ? `${hh}時間${mm}分` : mm ? `${mm}分${String(ss).padStart(2, '0')}秒` : `${ss}秒`;
}

const fmtDate = (t) => new Date(t * 1000).toLocaleString('ja-JP', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' });
const fmtSize = (b) => b >= 2 ** 30 ? (b / 2 ** 30).toFixed(1) + ' GB' : Math.round(b / 2 ** 20) + ' MB';

// "2026-09-17_101530" -> "9/17 10:15"
function fmtResultName(name) {
  const m = name.match(/^(\d{4})-(\d{2})-(\d{2})_(\d{2})(\d{2})/);
  return m ? `${Number(m[2])}/${Number(m[3])} ${m[4]}:${m[5]}` : name;
}

let S = null;
let sending = '';

async function run(label, fn) {
  try {
    await fn();
  } catch (e) {
    toast(e.message, 'bad');
  }
  refresh();
}

function toolCard(kind) {
  const isRadio = kind === 'radio_sync';
  const t = S[kind];
  const guide = S.guides[kind];
  const title = isRadio ? 'Radio Sync' : '動画クリッパー';
  const desc = isRadio
    ? 'ラジオ音声とカメラ映像を自動で合わせて、話ごとのMP4を書き出します。'
    : '動画を自動で文字起こししてテロップを入れ、盛り上がった場面の切り抜きを作ります。';
  let pill, extra = null;
  if (!t.installed) pill = h('span', { class: 'pill bad' }, 'フォルダが見つかりません');
  else if (!t.ready) pill = h('span', { class: 'pill bad' }, '準備が必要');
  else if (!t.running) pill = h('span', { class: 'pill off' }, '停止中');
  else if (!isRadio && t.state === 'running') {
    pill = h('span', { class: 'pill busy' }, `処理中 ${t.percent}%`);
    extra = [h('div', { class: 'progress' }, h('div', { style: `width:${t.percent}%` }))];
  }
  else pill = h('span', { class: 'pill on' }, '起動中');

  const note = !t.installed
    ? h('p', { class: 'small' }, '下の「ツールの場所」でフォルダを設定してください。')
    : !t.ready
      ? h('p', { class: 'small' }, `${title} のフォルダにある setup_windows.bat を一度実行してください。`)
      : null;

  return [
    h('div', { class: 'tool-head' }, h('h2', {}, h('span', { class: 'dot' }), title), pill),
    h('p', {}, desc),
    extra, note,
    h('div', { class: 'actions' },
      h('button', {
        class: isRadio ? 'primary' : 'cam',
        disabled: !t.installed || !t.ready,
        onclick: () => run(title, async () => {
          await api('/api/start', { tool: kind });
          toast(t.running ? `${title}を開きました` : `${title}を起動しています。少し待つと画面が開きます。`);
        }),
      }, t.running ? '開く' : '起動して開く'),
      guide && h('button', { onclick: () => run('guide', () => api('/api/open', { path: guide })) }, 'ガイド'),
      t.dir && h('button', { class: 'ghost', onclick: () => run('folder', () => api('/api/open', { path: t.dir })) }, 'フォルダ')),
  ];
}

function render() {
  $('toolRadio').replaceChildren(...toolCard('radio_sync').flat().filter(Boolean));
  $('toolClipper').replaceChildren(...toolCard('clipper').flat().filter(Boolean));

  const c = S.clipper;
  const busy = c.running && c.state === 'running';
  $('busyNotice').hidden = !busy;
  $('busyNotice').textContent = busy ? `動画クリッパーは処理中です(${c.percent}%)。終わってから次の動画を送ってください。` : '';
  $('pickSend').disabled = busy || !!sending || !c.installed;

  $('exports').replaceChildren(S.exports.length
    ? h('ul', { class: 'rows' }, S.exports.map((e) => h('li', {},
        h('div', {},
          h('div', { class: 'row-name', title: e.path }, e.name),
          h('div', { class: 'row-sub' }, h('span', {}, fmtDuration(e.duration)), h('span', {}, `${fmtDate(e.at)} 書き出し`), h('span', {}, fmtSize(e.size)))),
        h('div', { class: 'actions' },
          h('button', { class: 'ghost', onclick: () => run('show', () => api('/api/open', { path: e.path })) }, '場所を表示'),
          h('button', {
            class: 'cam', disabled: busy || !!sending || !c.installed,
            onclick: () => send(e.path, e.name),
          }, sending === e.path ? '送っています…' : 'テロップ・切り抜きへ送る')))))
    : h('div', { class: 'empty' }, 'まだありません。Radio Sync で話ごとの動画を書き出すと、ここに並びます。'));

  $('results').replaceChildren(S.results.length
    ? h('ul', { class: 'rows' }, S.results.map((r) => h('li', {},
        h('div', {}, h('div', { class: 'row-name' }, `${fmtResultName(r.name)} の処理`), h('div', { class: 'row-sub' }, h('span', {}, `動画 ${r.videos} 本`))),
        h('div', { class: 'actions' }, h('button', { onclick: () => run('open', () => api('/api/open', { path: r.path })) }, 'フォルダを開く')))))
    : h('div', { class: 'empty' }, 'まだありません。動画クリッパーで処理すると、ここに並びます。'));

  $('paths').replaceChildren(...[['radio_sync', 'Radio Sync'], ['clipper', '動画クリッパー']].map(([k, label]) =>
    h('div', { class: 'path-row' },
      h('b', {}, label),
      h('div', { class: 'path', title: S[k].dir || '' }, S[k].dir || '未設定'),
      h('button', { onclick: () => run('path', async () => {
        const r = await api('/api/tool-folder', { tool: k });
        if (r.ok) toast(`${label}の場所を設定しました`);
      }) }, '変更'))));
}

async function send(path, name) {
  sending = path;
  render();
  try {
    await api('/api/send', { path });
    toast(`「${name}」を動画クリッパーに渡しました。動画クリッパーの画面で内容を確認して「次へ」に進んでください。`);
  } catch (e) {
    toast(e.message, 'bad');
  } finally {
    sending = '';
    refresh();
  }
}

$('pickSend').onclick = async () => {
  sending = 'picked';
  render();
  try {
    const r = await api('/api/pick-send', {});
    if (r.ok) toast(`「${r.name}」を動画クリッパーに渡しました。`);
  } catch (e) {
    toast(e.message, 'bad');
  } finally {
    sending = '';
    refresh();
  }
};

async function refresh() {
  try {
    S = await api('/api/state');
    render();
  } catch { /* banner shows the problem */ }
}

if (!TOKEN) {
  document.body.replaceChildren(h('p', { style: 'padding:40px;text-align:center' }, '制作ハブは「はじめる」から起動してください。'));
} else {
  refresh();
  setInterval(refresh, 3000);
  window.addEventListener('focus', refresh);
  window.addEventListener('pagehide', () => navigator.sendBeacon(`/api/bye?t=${encodeURIComponent(TOKEN)}`));
}
</script>
</body>
</html>
